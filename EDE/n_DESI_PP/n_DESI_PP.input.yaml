theory:
  classy:
    path: null
    ignore_obsolete: true
    extra_args:
      non linear: halofit
      N_ncdm: 1
      N_ur: 2.0328
      gauge: synchronous
      scf_potential: axion
      scf_evolve_as_fluid: 'no'
      scf_evolve_like_axionCAMB: 'no'
      do_shooting: 'yes'
      do_shooting_scf: 'yes'
      scf_has_perturbations: 'yes'
      attractor_ic_scf: 'no'
      compute_phase_shift: 'no'
likelihood:
  planck_2018_lowl.TT: null
  planck_2018_lowl.EE: null
  planck_NPIPE_highl_CamSpec.TTTEEE: null
  planckpr4lensing: null
  act_dr6_lenslike.ACTDR6LensLike:
    lens_only: false
    stop_at_error: true
    lmax: 4000
    variant: actplanck_baseline
  sn.pantheonplus: null
  bao.desi_dr2: null
params:
  logA:
    prior:
      min: 2.7
      max: 3.4
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    latex: \log(10^{10} A_\mathrm{s})
    drop: true
  A_s:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  n_s:
    prior:
      min: 0.92
      max: 1.04
    ref:
      dist: norm
      loc: 0.975
      scale: 0.005
    proposal: 0.002
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 60
      max: 80
    ref:
      dist: norm
      loc: 70
      scale: 1
    proposal: 1
    latex: H_0
  omega_b:
    prior:
      min: 0.019
      max: 0.026
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omega_cdm:
    prior:
      min: 0.08
      max: 0.2
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
  Omega_m:
    latex: \Omega_\mathrm{m}
  omegamh2:
    derived: 'lambda Omega_m, H0: Omega_m*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  m_ncdm:
    value: 0.06
    renames: mnu
  Omega_Lambda:
    latex: \Omega_\Lambda
  YHe:
    latex: Y_\mathrm{P}
  tau_reio:
    prior:
      min: 0.02
      max: 0.12
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  z_reio:
    latex: z_\mathrm{re}
  n_axion:
    prior:
      min: 2.0
      max: 5.5
    ref:
      dist: norm
      loc: 3.8
      scale: 0.2
    proposal: 0.2
    latex: n_\mathrm{axion}
  log10_zc:
    prior:
      min: 3.1
      max: 4.0
    ref:
      dist: norm
      loc: 3.55
      scale: 0.08
    proposal: 0.08
    latex: \log_{10}(z_c)
    drop: true
  log10_axion_ac:
    value: 'lambda log10_zc: -log10_zc'
    derived: false
  ln1plusz_c:
    derived: 'lambda log10_zc: np.log1p(10**log10_zc)'
    latex: \ln(1+z_c)
  fEDE:
    prior:
      min: 0.0001
      max: 0.25
    ref: 0.08
    proposal: 0.025
    latex: f_\mathrm{EDE}(z_c)
    drop: true
  fraction_axion_ac:
    value: 'lambda fEDE: fEDE'
    derived: false
  Theta_ini:
    prior:
      min: 0.1
      max: 3.1
    ref: 2.75
    latex: \Theta_\mathrm{ini}
    drop: true
  scf_parameters:
    value: 'lambda Theta_ini: str(Theta_ini)+",0.0"'
    derived: false
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  S8:
    derived: 'lambda sigma8, Omega_m: sigma8*(Omega_m/0.3)**0.5'
    latex: S_8
  s8omegamp25:
    derived: 'lambda sigma8, Omega_m: sigma8*Omega_m**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  A:
    derived: 'lambda A_s: 1e9*A_s'
    latex: 10^9 A_\mathrm{s}
  clamp:
    derived: 'lambda A_s, tau_reio: 1e9*A_s*np.exp(-2*tau_reio)'
    latex: 10^9 A_\mathrm{s} e^{-2\tau}
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rs_drag:
    latex: r_\mathrm{drag}
  H0rd:
    derived: 'lambda H0, rs_drag: H0*rs_drag'
    latex: H_0r_d
sampler:
  polychord:
    path: null
    num_repeats: 2d
    nlive: 25d
    precision_criterion: 0.001
output: n_DESI_PP
