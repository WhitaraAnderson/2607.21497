theory:
  classy:
    path: null
    speed: 0.2
    stop_at_error: false
    extra_args:
      non linear: halofit
      N_ncdm: 1
      N_ur: 2.0328
      gauge: synchronous
      scf_potential: axion
      n_axion: 3
      scf_evolve_as_fluid: 'no'
      scf_evolve_like_axionCAMB: 'no'
      do_shooting: 'yes'
      do_shooting_scf: 'yes'
      scf_has_perturbations: 'yes'
      attractor_ic_scf: 'no'
      compute_phase_shift: 'no'
    ignore_obsolete: true
    renames:
      As: A_s
      ns: n_s
      nrun: alpha_s
      nrunrun: beta_s
      nt: n_t
      ntrun: alpha_t
      rdrag: rs_drag
      omegak: Omega_k
      omegal: Omega_Lambda
      w: w0_fld
      wa: wa_fld
      omegabh2: omega_b
      omegab: Omega_b
      omegach2: omega_cdm
      omegac: Omega_cdm
      omegam: Omega_m
      omegan: Omega_nu
      tau: tau_reio
      zrei: z_reio
      deltazrei: reionization_width
      helium_redshift: helium_fullreio_redshift
      helium_delta_redshift: helium_fullreio_width
      yhe: YHe
      yheused: YHe
    version: v3.3.0
    input_params:
    - A_s
    - n_s
    - H0
    - omega_b
    - omega_cdm
    - m_ncdm
    - tau_reio
    - log10_axion_ac
    - fraction_axion_ac
    - scf_parameters
    output_params:
    - Omega_m
    - Omega_Lambda
    - YHe
    - z_reio
    - sigma8
    - age
    - rs_drag
likelihood:
